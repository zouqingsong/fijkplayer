group = 'com.befovy.fijkplayer'
version = '0.11.3'

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: "kotlin-android"

android {
    namespace = 'com.befovy.fijkplayer'
    packagingOptions {
        // No pickFirst for libc++_shared.so - use the version with 16KB page size support
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
   
    defaultConfig {
        minSdk = 24
        
        // arm64-v8a only (armeabi-v7a FFmpeg not built)
        ndk { 
            abiFilters 'arm64-v8a'
            // Support 16KB page sizes for Android 15+
            // https://developer.android.com/guide/practices/page-sizes
            debugSymbolLevel 'SYMBOL_TABLE'
        }
        
        // CMake configuration for native builds
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    // Link to CMakeLists.txt
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }

     dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

      testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // AndroidX dependencies
    implementation 'androidx.annotation:annotation:1.2.0'
}
