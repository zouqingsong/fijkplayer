group = 'com.befovy.fijkplayer'
version = '0.11.0'

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: "kotlin-android"

android {
    namespace = 'com.befovy.fijkplayer'
    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
   
    defaultConfig {
        minSdk = 24
        
        // Support both 64-bit (required by Google Play) and 32-bit ARM
        ndk { 
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        
        // CMake configuration for native builds
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11'
                // Enable software decoder for diagnostics (comment out for normal MediaCodec)
                // arguments '-DANDROID_STL=c++_shared', '-DUSE_SOFTWARE_DECODER=ON'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    
    // Link to CMakeLists.txt
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }

     dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

      testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // AndroidX dependencies
    implementation 'androidx.annotation:annotation:1.2.0'
}
